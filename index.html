<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>한글 타자연습</title>
    <link rel="stylesheet", href="./style.css">
  </head>
  <body>
    <main>
      <h1>서윤이의 타자연습</h1>
      <p>문장을 따라 입력하세요. Enter를 누르면 다음 문장으로 넘어갑니다.</p>
      <section class="stats" aria-label="타자 기록">
        <p>평균 타수 <strong id="average-speed">0</strong> 타/분</p>
        <p>최고 타수 <strong id="best-speed">0</strong> 타/분</p>
        <p>정확도 <strong id="accuracy">0</strong>%</p>
      </section>
      <p id="sentence" aria-live="polite"></p>
      <label for="typing-input">문장 입력</label>
      <input id="typing-input" type="text" autocomplete="off" autofocus />
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
